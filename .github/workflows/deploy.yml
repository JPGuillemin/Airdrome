name: Deploy Vue App

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Read version
        id: version
        run: |
          source VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          BASE_PATH: /Airdrome/
          VERSION: ${{ steps.version.outputs.version }}

      - name: Rewrite web manifest for the GitHub Pages base path
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const file = 'dist/manifest.webmanifest'
          const base = process.env.BASE_PATH || '/'
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))

          manifest.start_url = base
          manifest.scope = base
          manifest.icons = (manifest.icons || []).map(function (icon) {
            return Object.assign({}, icon, {
              src: base + icon.src.replace(/^\//, '')
            })
          })

          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n')
          NODE
        env:
          BASE_PATH: /Airdrome/

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - run: ls -R dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
