apply plugin: 'com.android.application'

android {
    namespace = "com.jpguillemin.airdrome"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.jpguillemin.airdrome"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Prefer the CI/build-script environment; fall back to the VERSION
        // file so a plain `./gradlew assembleDebug` also gets a real version.
        def versionFile = file("../../VERSION")
        def versionNameValue = System.getenv("VERSION")
        def versionCodeValue = System.getenv("VERSION_CODE")

        if (versionFile.exists()) {
            def text = versionFile.text

            if (versionNameValue == null) {
                def nameMatcher = text =~ /VERSION="([^"]+)"/
                if (nameMatcher.find()) versionNameValue = nameMatcher.group(1)
            }

            if (versionCodeValue == null) {
                def codeMatcher = text =~ /VERSION_CODE="([^"]+)"/
                if (codeMatcher.find()) versionCodeValue = codeMatcher.group(1)
            }
        }

        if (versionNameValue == null) versionNameValue = "0.0.0"
        if (versionCodeValue == null) versionCodeValue = "1"

        versionName versionNameValue
        versionCode versionCodeValue.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Release builds are signed with a keystore when one is supplied.
            // CI can provide STORE_PASSWORD / KEY_PASSWORD and a keystore file;
            // local `assembleDebug` builds never touch this block.
            def keystore = file("airdrome-release.keystore")

            if (keystore.exists()) {
                storeFile keystore
                storePassword = System.getenv("STORE_PASSWORD") ?: "airdrome"
                keyAlias = System.getenv("KEY_ALIAS") ?: "airdrome"
                keyPassword = System.getenv("KEY_PASSWORD") ?: "airdrome"
            }
        }
    }

    buildTypes {
        release {
            // No release key present: fall back to the debug key so a clean
            // checkout still produces an installable release APK.
            if (file("airdrome-release.keystore").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Native debugging / logcat builds use the debug signing key.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
